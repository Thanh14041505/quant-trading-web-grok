[project]
name = "vn-quant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "vnai @ https://files.pythonhosted.org/packages/1f/34/7f419ef6661009006fbc149f4fca26159b7f56d9836b6cb9c170c3c0c465/vnai-2.6.1-py3-none-any.whl",
  "vnstock @ git+https://github.com/thinh-vu/vnstock.git@v4.0.4",
  "pandas>=2.0.0,<3",
  "requests>=2.28.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "pydantic>=2.0.0",
  "openpyxl>=3.1.0",
  "tenacity>=8.0.0",
  "pytz>=2023.3",
  "psutil>=5.9.0",
  "packaging>=20.0",
  "seaborn>=0.13.0",
]

[tool.uv]
environments = [
  "sys_platform == 'linux'",
]

# Extra index của Vnstock (fallback nếu wheel fail)
[[tool.uv.index]]
name = "vnstock-official"
url = "https://vnstocks.com/api/simple"
explicit = true